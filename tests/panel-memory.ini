set cpu 11/70,4M
set realcons disconnected
deposit 0 177777
deposit 200 177777
deposit 17757776 177777
do systems/panel/boot.ini
assert PC=0
assert PSW=340
examine 0
examine 200
examine 17757776
; mov #1,r0; inc r0; halt
 deposit 200 012700
 deposit 202 000001
 deposit 204 005200
 deposit 206 000000
run 200
assert R0=2
assert PC=210
do systems/panel/boot.ini
assert R0=0
assert PC=0
