; exercise real PDP-11 instructions without a panel, disks, or network
set cpu 11/70,4M
set realcons disconnected
; mov #5,r0; mov #7,r1; add r1,r0; mov r0,@#1000; halt
 deposit 200 012700
 deposit 202 5
 deposit 204 012701
 deposit 206 7
 deposit 210 060100
 deposit 212 010037
 deposit 214 1000
 deposit 216 0
run 200
assert R0=14
assert R1=7
assert PC=220
; reload the stored result to exercise absolute memory addressing
 deposit 220 013702
 deposit 222 1000
 deposit 224 0
continue
assert R2=14
assert PC=226
echo HEADLESS_SMOKE_PASSED
quit
